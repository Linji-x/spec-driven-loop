name: Bug report
description: Report behavior that contradicts the documented Spec-Driven Loop workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, customer names, private paths, and proprietary code before submitting.
  - type: input
    id: environment
    attributes:
      label: Codex environment
      description: Codex app/CLI version, operating system, and installation method.
      placeholder: Codex Desktop on Windows; installed with $skill-installer from v1.0.0
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: Invocation and context
      description: Show the exact $spec-driven-loop invocation and enough public context to reproduce it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: loop
    attributes:
      label: Sanitized LOOP.md evidence
      description: Include the smallest relevant state, judgment, or error excerpt.
      render: markdown
  - type: dropdown
    id: stage
    attributes:
      label: Workflow stage
      options:
        - Inspect
        - Grill
        - Freeze
        - Agents
        - Judge
        - Loop / resume
        - Installation / discovery
        - Plugin Preview
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private repository paths, and proprietary code.
          required: true
